<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raio-X | Novera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* TEMA CLARO - Padrão Novera ERP */
        body { font-family: 'Montserrat', sans-serif; background: #Fdfbfb; color: #2C2A2B; margin: 0; padding: 20px; padding-top: 30px; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .logo-header { width: 140px; margin-bottom: 15px; filter: drop-shadow(0 8px 15px rgba(184, 124, 150, 0.2)); object-fit: contain; } 
        
        .header h1 { font-size: 1.4rem; margin: 0; color: #966178; font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: 1px; }
        .header p { color: #888; font-size: 0.8rem; margin: 5px 0 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        
        /* Total no Topo */
        .total-badge { background: linear-gradient(135deg, #966178 0%, #7a4a5e 100%); color: white; padding: 15px 25px; border-radius: 16px; display: inline-block; box-shadow: 0 8px 25px rgba(150, 97, 120, 0.3); margin-bottom: 10px; min-width: 150px;}
        .total-badge span { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; opacity: 0.9; font-weight: 800;}
        .total-badge strong { font-size: 2.2rem; font-weight: 900; line-height: 1; }

        /* Estilo dos Cards Claros */
        .card { background: #fff; border: 1px solid #E8DDE1; border-radius: 16px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .card img { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; background: #fdf5f7; border: 1px solid #E8DDE1; flex-shrink: 0; }
        
        .img-fallback { width: 65px; height: 65px; border-radius: 10px; background: #fdf5f7; border: 1px solid #E8DDE1; display: flex; align-items: center; justify-content: center; color: #966178; font-weight: 900; font-size: 1.2rem; flex-shrink: 0; }
        
        .info { flex: 1; min-width: 0; }
        .info h3 { margin: 0 0 5px; font-size: 0.9rem; color: #2C2A2B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; }
        .info span.codigo { background: #fdf5f7; color: #966178; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; margin-right: 5px; font-weight: 900; border: 1px solid #f3d8e2;}
        .info p { margin: 0; color: #888; font-size: 0.7rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;}
        
        .qtd-box { background: #fdf5f7; color: #966178; border: 2px solid #f3d8e2; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; flex-shrink: 0; }
        
        /* Título do Grupo/Separador */
        .group-header { margin: 25px 0 12px; border-bottom: 2px solid #E8DDE1; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: flex-end; }
        .group-header h2 { margin: 0; color: #7a4a5e; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;}
        .group-subtotal { background: #fdf5f7; color: #966178; padding: 3px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 900; border: 1px solid #f3d8e2; }

        .loading { text-align: center; color: #888; font-size: 0.9rem; margin-top: 50px; animation: pisca 1s infinite alternate; font-weight: 600;}
        @keyframes pisca { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Novera Scent" class="logo-header" onerror="this.style.display='none'">
        <h1>📦 RAIO-X NOVERA</h1>
        <p id="nome-caixa">Carregando...</p>
        
        <div id="total-container" style="display: none;">
            <div class="total-badge">
                <span>Total Físico Geral</span>
                <strong id="total-itens-header">0</strong>
            </div>
        </div>
    </div>

    <div id="conteudo-caixa">
        <div class="loading">Buscando no cofre...</div>
    </div>

    <script>
        const API_NOVERA_NFC = "https://bdfernando.alwaysdata.net/api/nfc";
        
        const urlParams = new URLSearchParams(window.location.search);
        const filtroGenero = urlParams.get('genero') ? urlParams.get('genero').toLowerCase() : null;
        const filtroTipo = urlParams.get('tipo') ? urlParams.get('tipo').toLowerCase() : null;

        let titulos = [];
        if(filtroTipo) {
            let tiposFormatados = filtroTipo.split(',').map(t => t.trim().toUpperCase()).join(' • ');
            titulos.push(tiposFormatados);
        }
        if(filtroGenero) titulos.push(filtroGenero.toUpperCase());
        
        document.getElementById('nome-caixa').innerText = titulos.length > 0 ? titulos.join(" | ") : "VISÃO GERAL (SEDE)";

        async function carregarRaioX() {
            try {
                const res = await fetch(API_NOVERA_NFC);
                const dados = await res.json();
                
                if (dados.sucesso) {
                    let produtos = dados.estoque;

                    if (filtroGenero) {
                        produtos = produtos.filter(p => p.genero === filtroGenero);
                    }
                    
                    if (filtroTipo) {
                        const tiposPermitidos = filtroTipo.split(',').map(t => t.trim());
                        produtos = produtos.filter(p => {
                            const pTipo = String(p.tipo).toLowerCase();
                            return tiposPermitidos.some(tPermitido => pTipo.includes(tPermitido));
                        });
                    }

                    const container = document.getElementById('conteudo-caixa');
                    
                    if (produtos.length === 0) {
                        container.innerHTML = `<div style="text-align:center; margin-top:40px; color:#888; font-size:0.9rem; font-weight:600;">Caixa Vazia ou Produtos Esgotados.</div>`;
                        document.getElementById('total-itens-header').innerText = "0";
                        document.getElementById('total-container').style.display = 'block';
                        return;
                    }

                    let grupos = {};
                    let totalItensGeral = 0;

                    produtos.forEach(p => {
                        totalItensGeral += p.qtd;
                        
                        let tipoNome = p.tipo ? String(p.tipo).trim().toUpperCase() : "OUTROS";
                        
                        if (!grupos[tipoNome]) {
                            grupos[tipoNome] = {
                                subtotal: 0,
                                itens: []
                            };
                        }
                        
                        grupos[tipoNome].subtotal += p.qtd;
                        grupos[tipoNome].itens.push(p);
                    });

                    let tiposOrdenados = Object.keys(grupos).sort();
                    let html = "";

                    tiposOrdenados.forEach(tipo => {
                        let grupoAtual = grupos[tipo];
                        
                        // ======== A MÁGICA DA ORDENAÇÃO ACONTECE AQUI ========
                        grupoAtual.itens.sort((a,b) => {
                            let genA = String(a.genero || "").toLowerCase();
                            let genB = String(b.genero || "").toLowerCase();
                            
                            // Pesos para garantir a ordem exata dos blocos visuais
                            const ordemGen = { "feminino": 1, "masculino": 2, "unissex": 3, "infantil": 4 };
                            let pesoA = ordemGen[genA] || 99;
                            let pesoB = ordemGen[genB] || 99;
                            
                            // Se forem gêneros diferentes, agrupa pela cor/gênero
                            if (pesoA !== pesoB) {
                                return pesoA - pesoB;
                            }
                            
                            // Se for do mesmo gênero (mesma cor), desempata organizando pelo código numérico
                            return String(a.codigo || "").localeCompare(String(b.codigo || ""));
                        });

                        html += `
                        <div class="group-header">
                            <h2>${tipo}</h2>
                            <div class="group-subtotal">${grupoAtual.subtotal} un</div>
                        </div>`;

                        grupoAtual.itens.forEach(p => {
                            let fotos = p.foto ? p.foto.split(',') : [];
                            let urlImg = fotos[0] || '';
                            
                            let imgTag = urlImg ? `<img src="${urlImg}" onerror="this.outerHTML='<div class=\\'img-fallback\\'>NS</div>'">` : `<div class="img-fallback">NS</div>`;
                            
                            let corFundoGen = "#f3f4f6", corTextoGen = "#4b5563", iconeGen = "🌿";
                            let gLow = String(p.genero).toLowerCase();
                            
                            if(gLow === "masculino") { 
                                corFundoGen = "#e0f2fe"; corTextoGen = "#0369a1"; iconeGen = "👔"; 
                            } else if(gLow === "feminino") { 
                                corFundoGen = "#fce7f3"; corTextoGen = "#be185d"; iconeGen = "🌸"; 
                            } else if(gLow === "infantil") { 
                                corFundoGen = "#dcfce7"; corTextoGen = "#166534"; iconeGen = "🧸"; 
                            }
                            
                            let badgeGenero = p.genero ? `<span style="background:${corFundoGen}; color:${corTextoGen}; padding:3px 8px; border-radius:6px; font-size:0.6rem; font-weight:800; text-transform:uppercase; display:inline-block; margin-top:4px;">${iconeGen} ${p.genero}</span>` : '';

                            html += `
                            <div class="card">
                                ${imgTag}
                                <div class="info">
                                    <h3><span class="codigo">${p.codigo || '-'}</span> ${p.nome}</h3>
                                    ${badgeGenero}
                                </div>
                                <div class="qtd-box">${p.qtd}</div>
                            </div>`;
                        });
                    });

                    document.getElementById('total-itens-header').innerText = totalItensGeral;
                    document.getElementById('total-container').style.display = 'block';
                    container.innerHTML = html;
                }
            } catch(e) {
                document.getElementById('conteudo-caixa').innerHTML = `<div style="color:#A05252; text-align:center; font-weight:bold; margin-top:30px;">Erro ao conectar. Tente novamente.</div>`;
            }
        }

        carregarRaioX();
    </script>
</body>
</html>
