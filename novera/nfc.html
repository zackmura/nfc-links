<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raio-X | Novera</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; padding-top: 30px; }
        .header { text-align: center; margin-bottom: 25px; }
        
        /* Fundo branco no logo para dar destaque no fundo escuro */
        .logo-header { width: 130px; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(184, 124, 150, 0.3)); background: #Fdfbfb; border-radius: 12px; padding: 8px; object-fit: contain; } 
        
        .header h1 { font-size: 1.4rem; margin: 0; color: #fce7f3; font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: 1px; }
        .header p { color: #aaa; font-size: 0.8rem; margin: 5px 0 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        
        /* Total no Topo Bonitão */
        .total-badge { background: linear-gradient(135deg, #966178 0%, #7a4a5e 100%); color: white; padding: 15px 25px; border-radius: 16px; display: inline-block; box-shadow: 0 8px 25px rgba(150, 97, 120, 0.3); margin-bottom: 10px; min-width: 150px;}
        .total-badge span { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px; opacity: 0.8; font-weight: 800;}
        .total-badge strong { font-size: 2.2rem; font-weight: 900; line-height: 1; }

        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; }
        .card img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; background: #2a2a2a; border: 1px solid #444; flex-shrink: 0; }
        
        /* Substitui o ícone quebrado por um quadrado NS elegante */
        .img-fallback { width: 60px; height: 60px; border-radius: 10px; background: #2a2a2a; border: 1px solid #444; display: flex; align-items: center; justify-content: center; color: #966178; font-weight: 900; font-size: 1.2rem; flex-shrink: 0; }
        
        .info { flex: 1; min-width: 0; }
        .info h3 { margin: 0 0 5px; font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info span.codigo { background: #fdf5f7; color: #966178; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; margin-right: 5px; font-weight: 800;}
        .info p { margin: 0; color: #888; font-size: 0.7rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;}
        .qtd-box { background: #2e7d32; color: #fff; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; flex-shrink: 0; box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);}
        
        .loading { text-align: center; color: #888; font-size: 0.9rem; margin-top: 50px; animation: pisca 1s infinite alternate; font-weight: 600;}
        @keyframes pisca { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Novera Scent" class="logo-header" onerror="this.style.display='none'">
        <h1>📦 RAIO-X NOVERA</h1>
        <p id="nome-caixa">Carregando...</p>
        
        <div id="total-container" style="display: none;">
            <div class="total-badge">
                <span>Total Físico</span>
                <strong id="total-itens-header">0</strong>
            </div>
        </div>
    </div>

    <div id="conteudo-caixa">
        <div class="loading">Buscando no cofre...</div>
    </div>

    <script>
        const API_NOVERA_NFC = "https://bdfernando.alwaysdata.net/api/nfc";
        
        // Pega os parâmetros da URL
        const urlParams = new URLSearchParams(window.location.search);
        const filtroGenero = urlParams.get('genero') ? urlParams.get('genero').toLowerCase() : null;
        const filtroTipo = urlParams.get('tipo') ? urlParams.get('tipo').toLowerCase() : null;

        // Monta o nome dinâmico da caixa
        let titulos = [];
        if(filtroTipo) titulos.push(filtroTipo.toUpperCase());
        if(filtroGenero) titulos.push(filtroGenero.toUpperCase());
        
        document.getElementById('nome-caixa').innerText = titulos.length > 0 ? titulos.join(" - ") : "VISÃO GERAL (SEDE)";

        async function carregarRaioX() {
            try {
                const res = await fetch(API_NOVERA_NFC);
                const dados = await res.json();
                
                if (dados.sucesso) {
                    let produtos = dados.estoque;

                    // Aplica o Duplo Filtro (Ex: Tipo = Perfume E Genero = Feminino)
                    if (filtroGenero) {
                        produtos = produtos.filter(p => p.genero === filtroGenero);
                    }
                    if (filtroTipo) {
                        produtos = produtos.filter(p => String(p.tipo).toLowerCase().includes(filtroTipo));
                    }

                    // Ordena por CÓDIGO CRESCENTE (N001, N002, N003...)
                    produtos.sort((a,b) => String(a.codigo || "").localeCompare(String(b.codigo || "")));

                    const container = document.getElementById('conteudo-caixa');
                    
                    if (produtos.length === 0) {
                        container.innerHTML = `<div style="text-align:center; margin-top:40px; color:#666; font-size:0.9rem; font-weight:600;">Caixa Vazia ou Produtos Esgotados.</div>`;
                        document.getElementById('total-itens-header').innerText = "0";
                        document.getElementById('total-container').style.display = 'block';
                        return;
                    }

                    let html = "";
                    let totalItens = 0;

                    produtos.forEach(p => {
                        totalItens += p.qtd;
                        let fotos = p.foto ? p.foto.split(',') : [];
                        let urlImg = fotos[0] || '';
                        
                        // Se não tiver foto, monta a caixinha elegante "NS"
                        let imgTag = urlImg ? `<img src="${urlImg}" onerror="this.outerHTML='<div class=\\'img-fallback\\'>NS</div>'">` : `<div class="img-fallback">NS</div>`;
                        
                        html += `
                        <div class="card">
                            ${imgTag}
                            <div class="info">
                                <h3><span class="codigo">${p.codigo || '-'}</span> ${p.nome}</h3>
                                <p>${p.tipo}</p>
                            </div>
                            <div class="qtd-box">${p.qtd}</div>
                        </div>`;
                    });

                    document.getElementById('total-itens-header').innerText = totalItens;
                    document.getElementById('total-container').style.display = 'block';
                    container.innerHTML = html;
                }
            } catch(e) {
                document.getElementById('conteudo-caixa').innerHTML = `<div style="color:#ef4444; text-align:center; font-weight:bold; margin-top:30px;">Erro ao conectar. Tente novamente.</div>`;
            }
        }

        carregarRaioX();
    </script>
</body>
</html>
